    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <path d="M22 338C214 338 318 316 472 331C612 345 686 340 793 288C947 216 1000 42 1252 82" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.62"/>
  <path d="M28 350C214 350 326 330 476 343C615 356 688 348 806 309C953 236 1034 73 1250 111" stroke="#DFF8FF" stroke-width="1" stroke-linecap="round" opacity="0.18"/>
