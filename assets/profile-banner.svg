<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061523"/>
      <stop offset="0.52" stop-color="#0A2340"/>
      <stop offset="1" stop-color="#073C42"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 84) rotate(128) scale(360 440)">
      <stop stop-color="#35BDF4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#35BDF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="70" y1="100" x2="1170" y2="270" gradientUnits="userSpaceOnUse">
