    <text x="923" y="190" fill="#BCEAFF" font-size="16" font-family="Consolas, monospace">02  RAG       <tspan fill="#A78BFA">READY</tspan></text>
    <text x="923" y="218" fill="#BCEAFF" font-size="16" font-family="Consolas, monospace">03  SECURITY  <tspan fill="#35BDF4">ON</tspan></text>
